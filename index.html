<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>noted.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("noted_theme");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
          } else if (saved === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
              document.documentElement.classList.add("dark");
            } else {
              document.documentElement.classList.remove("dark");
            }
          }
          var savedFont = localStorage.getItem("noted_font_prefs");
          if (savedFont) {
            var fontPrefs = JSON.parse(savedFont);
            if (fontPrefs.fontFamily) document.documentElement.dataset.fontFamily = fontPrefs.fontFamily;
            if (fontPrefs.fontSize) document.documentElement.dataset.fontSize = fontPrefs.fontSize;
            if (fontPrefs.lineHeight) document.documentElement.dataset.lineHeight = fontPrefs.lineHeight;
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
